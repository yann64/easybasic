name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install valgrind, and GTK3/ayatana-appindicator3 dev files (M7b GUI unit tests)
        # No `xvfb` here unlike ci.yml's own matching step - this job only
        # *compiles* each e2e test's own input.pb under Valgrind (see the
        # step below's own comment), never runs the resulting binary, so
        # no live DISPLAY is ever needed, only GTK3's headers/pkg-config
        # files for pbcxx's own compile-time check (`Sema::usesGuiLibrary()`)
        # to succeed instead of refusing to compile a GUI program at all.
        run: sudo apt-get update && sudo apt-get install -y valgrind libgtk-3-dev libayatana-appindicator3-dev
      - name: Configure
        run: cmake --preset linux-gcc
      - name: Build
        run: cmake --build --preset linux-gcc
      # Deliberately *not* `ctest -T memcheck`: that wraps each e2e test's
      # own `bash run_case.sh ...` command, so without `--trace-children=yes`
      # Valgrind only ever instruments bash itself (a harmless, well-known
      # leak inside bash's own parser, nothing to do with this project's own
      # code) rather than the pbcxx/compiled-program child processes bash
      # actually spawns - confirmed by inspecting a real memcheck run's own
      # log, which reported the exact same "32+24 bytes lost" leak,
      # attributed to `make_simple_command`/`yyparse` inside
      # `/usr/bin/bash`, for every single e2e test. Adding
      # `--trace-children=yes` instead makes Valgrind *also* trace into the
      # g++ invocation pbcxx itself shells out to compile the generated
      # C++ - correct, but tens of seconds per test under Valgrind's own
      # instrumentation overhead, impractical for the full suite even as a
      # nightly job. Running Valgrind directly on the two things this
      # project actually wants checked - the Catch2 unit tests (in-process,
      # no subprocess spawning, ~4s) and pbcxx itself compiling each e2e
      # test's own input.pb (no child-tracing needed, since the point is
      # pbcxx's *own* memory use, not g++'s - ~1-2s each) - is both faster
      # and more meaningful than instrumenting a shell interpreter this
      # project doesn't own.
      - name: Valgrind - unit tests
        run: |
          valgrind --leak-check=full --error-exitcode=1 \
            ./build/linux-gcc/tests/unit/easybasic_unit_tests
      - name: Valgrind - pbcxx itself, compiling every e2e test program
        run: |
          status=0
          for input in tests/e2e/*/input.pb; do
            echo "::group::$input"
            if ! valgrind --leak-check=full --error-exitcode=1 \
                ./build/linux-gcc/compiler/pbcxx "$input" -o /tmp/vg_out -d; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
