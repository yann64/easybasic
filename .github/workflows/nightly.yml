name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Configure
        run: cmake --preset linux-gcc -DMEMORYCHECK_COMMAND=$(command -v valgrind) -DMEMORYCHECK_COMMAND_OPTIONS="--leak-check=full --error-exitcode=1"
      - name: Build
        run: cmake --build --preset linux-gcc
      - name: Test under Valgrind memcheck
        working-directory: build/linux-gcc
        run: ctest -T memcheck
