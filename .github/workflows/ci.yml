name: CI

on:
  push:
  pull_request:

jobs:
  linux-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset linux-gcc
      - name: Build
        run: cmake --build --preset linux-gcc
      - name: Test
        run: ctest --preset linux-gcc

  linux-clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Configure
        run: cmake --preset linux-clang
      - name: Build
        run: cmake --build --preset linux-clang
      - name: Test
        run: ctest --preset linux-clang
      - name: Test (clang++ as the generated-code backend too)
        run: CXX=clang++ ctest --preset linux-clang

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Configure
        run: cmake --preset linux-clang-sanitize
      - name: Build
        run: cmake --build --preset linux-clang-sanitize
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --preset linux-clang-sanitize

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy and cppcheck
        run: sudo apt-get update && sudo apt-get install -y clang-tidy cppcheck
      - name: Configure (for compile_commands.json)
        run: cmake --preset linux-clang -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: clang-tidy
        run: |
          run-clang-tidy -p build/linux-clang \
            $(find compiler/src runtime/include -name '*.cpp' -o -name '*.hpp')
      - name: cppcheck
        # `--enable=style,warning,performance,portability` deliberately
        # excludes `information` (what `--enable=all` would additionally
        # pull in) - this cppcheck version's `--error-exitcode` counts an
        # enabled `information`-severity notice (e.g.
        # `normalCheckLevelMaxBranches`, printed once per file; the
        # generated-at-build-time `easybasic/version.hpp` not being found
        # during this standalone lint pass) as a failure too, which isn't
        # the kind of thing this gate should ever block on. Explicit
        # `--suppress=` IDs below are for specific *style* findings already
        # reviewed and accepted as not real bugs:
        #   - useStlAlgorithm/constVariableReference: style preferences,
        #     not adopted (raw loops and non-const auto& downcasts are
        #     pervasive and intentional throughout parser/sema/codegen).
        #   - unusedFunction: flags public API kept for tests/future
        #     callers that cppcheck's whole-program view can't see used
        #     (DiagnosticEngine::warning/diagnostics(),
        #     constDeclarationOrder()) - and, once runtime/include's own
        #     .hpp files are checked as their own standalone translation
        #     units (see below), *every* runtime library function, since
        #     none of them are "called" from within their own header.
        #   - duplicateAssignExpression: a false positive in
        #     stringlib.hpp's pbUtf16Slice - byteStart/byteEnd are
        #     deliberately both initialized to the same `utf8.size()`
        #     sentinel ("default to end of string"), not a copy-paste bug.
        #   - noExplicitConstructor: PBString's implicit single-argument
        #     constructors are deliberate, for PB's own value-semantics
        #     ergonomics (`s = "hi"` needs an implicit `const char*`
        #     conversion).
        # `compiler/src` is passed as a plain directory (cppcheck's normal
        # mode: scan each .cpp, pulling in its own headers via #include, so
        # a header's usage is seen in context) - but runtime/include's own
        # .hpp files have to be passed explicitly, since a header-only
        # directory with no .cpp of its own is otherwise silently never
        # scanned at all (confirmed: `cppcheck runtime/include` alone
        # errors with "could not find or open any of the paths given").
        run: |
          cppcheck --enable=style,warning,performance,portability --inconclusive --error-exitcode=1 \
            --suppress=useStlAlgorithm --suppress=constVariableReference \
            --suppress=unusedFunction --suppress=duplicateAssignExpression \
            --suppress=noExplicitConstructor -I compiler/src -I runtime/include --std=c++20 \
            compiler/src $(find runtime/include -name '*.hpp')

  windows-mingw:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            diffutils
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
      - name: Configure
        run: cmake --preset windows-mingw
      - name: Build
        run: cmake --build --preset windows-mingw
      - name: Test
        run: ctest --preset windows-mingw

  # Haiku is not part of this matrix - no GitHub-hosted Haiku image exists.
  # The real path to Haiku CI is registering an SSH-reachable qemu VM as a
  # self-hosted runner (M6) - see docs/architecture/roadmap.md's M6 notes.
