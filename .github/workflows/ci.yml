name: CI

on:
  push:
  pull_request:

jobs:
  linux-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK3/ayatana-appindicator3 dev files (M7b GUI unit tests) and Xvfb
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev xvfb
      - name: Configure
        run: cmake --preset linux-gcc
      - name: Build
        run: cmake --build --preset linux-gcc
      - name: Test
        # GDK_BACKEND=x11 avoids GTK silently preferring a (nonexistent,
        # on this runner) Wayland compositor over the Xvfb X11 display
        # xvfb-run just started - see the M7b roadmap notes; this dev
        # machine's own Xvfb+Wayland-coexistence testing hit the same
        # thing. NO_AT_BRIDGE=1 skips GTK's own accessibility (AT-SPI)
        # D-Bus bridge, which has nothing to connect to here anyway -
        # confirmed its one-time setup allocations otherwise look like a
        # LeakSanitizer false positive on this runner image specifically
        # (see tests/lsan-suppressions.txt's own matching entry, kept as a
        # defensive backup).
        run: xvfb-run -a env GDK_BACKEND=x11 NO_AT_BRIDGE=1 ctest --preset linux-gcc

  linux-clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang, GTK3/ayatana-appindicator3 dev files (M7b GUI unit tests), and Xvfb
        run: sudo apt-get update && sudo apt-get install -y clang libgtk-3-dev libayatana-appindicator3-dev xvfb
      - name: Configure
        run: cmake --preset linux-clang
      - name: Build
        run: cmake --build --preset linux-clang
      - name: Test
        run: xvfb-run -a env GDK_BACKEND=x11 NO_AT_BRIDGE=1 ctest --preset linux-clang
      - name: Test (clang++ as the generated-code backend too)
        run: xvfb-run -a env GDK_BACKEND=x11 NO_AT_BRIDGE=1 CXX=clang++ ctest --preset linux-clang

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang, GTK3/ayatana-appindicator3 dev files (M7b GUI unit tests), and Xvfb
        run: sudo apt-get update && sudo apt-get install -y clang libgtk-3-dev libayatana-appindicator3-dev xvfb
      - name: Configure
        run: cmake --preset linux-clang-sanitize
      - name: Build
        run: cmake --build --preset linux-clang-sanitize
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          # fontconfig/pango-ft2's own process-lifetime cache looks like a
          # leak to LSan but isn't a bug in pbcxx - see
          # tests/lsan-suppressions.txt's own header comment.
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan-suppressions.txt
        run: xvfb-run -a env GDK_BACKEND=x11 NO_AT_BRIDGE=1 ctest --preset linux-clang-sanitize

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy, cppcheck, and GTK3/ayatana-appindicator3 dev files (M7b GUI unit tests)
        run: sudo apt-get update && sudo apt-get install -y clang-tidy cppcheck libgtk-3-dev libayatana-appindicator3-dev
      - name: Configure (for compile_commands.json)
        run: cmake --preset linux-clang -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: clang-tidy
        run: |
          run-clang-tidy -p build/linux-clang \
            $(find compiler/src runtime/include -name '*.cpp' -o -name '*.hpp')
      - name: cppcheck
        # `--enable=style,warning,performance,portability` deliberately
        # excludes `information` (what `--enable=all` would additionally
        # pull in) - this cppcheck version's `--error-exitcode` counts an
        # enabled `information`-severity notice (e.g.
        # `normalCheckLevelMaxBranches`, printed once per file; the
        # generated-at-build-time `easybasic/version.hpp` not being found
        # during this standalone lint pass) as a failure too, which isn't
        # the kind of thing this gate should ever block on. Explicit
        # `--suppress=` IDs below are for specific *style* findings already
        # reviewed and accepted as not real bugs:
        #   - useStlAlgorithm/constVariableReference: style preferences,
        #     not adopted (raw loops and non-const auto& downcasts are
        #     pervasive and intentional throughout parser/sema/codegen).
        #   - unusedFunction: flags public API kept for tests/future
        #     callers that cppcheck's whole-program view can't see used
        #     (DiagnosticEngine::warning/diagnostics(),
        #     constDeclarationOrder()) - and, once runtime/include's own
        #     .hpp files are checked as their own standalone translation
        #     units (see below), *every* runtime library function, since
        #     none of them are "called" from within their own header.
        #   - duplicateAssignExpression: a false positive in
        #     stringlib.hpp's pbUtf16Slice - byteStart/byteEnd are
        #     deliberately both initialized to the same `utf8.size()`
        #     sentinel ("default to end of string"), not a copy-paste bug.
        #   - noExplicitConstructor: PBString's implicit single-argument
        #     constructors are deliberate, for PB's own value-semantics
        #     ergonomics (`s = "hi"` needs an implicit `const char*`
        #     conversion).
        #   - shadowFunction: pblist.hpp's PBList::deleteElement() has a
        #     local `current` that shadows the unrelated PBList::current()
        #     member function - harmless (the local is never meant to call
        #     the method), just a coincidental name reuse.
        #   - localMutex: a false positive in threadlib.hpp's pbLockMutex -
        #     cppcheck's check assumes a mutex locked in the same scope it
        #     was declared is pointless (a genuinely local, stack-only
        #     mutex can't synchronize anything across threads), but `mutex`
        #     here is a raw pointer *to* a std::recursive_mutex that lives
        #     persistently in the global mutexTable(), not a local object -
        #     cppcheck's syntactic check doesn't trace that distinction.
        #   - unsignedLessThanZero: a false positive in guilib.hpp's
        #     pbNextSelectedFileName (M7b's Requester slice) - `cursor` is a
        #     `std::size_t&` bound to a *persistent*, static reference cell
        #     also written to (reset to `0`) by a separate function
        #     (pbOpenFileRequester) earlier in the same file; cppcheck's
        #     value-flow analysis incorrectly treats that unrelated write as
        #     if it were a local invariant still holding here, misreading
        #     the resulting always-unsigned `cursor >= files.size()` bounds
        #     check as suspicious. Both operands are genuinely `std::size_t`
        #     - no actual sign issue.
        # `compiler/src` is passed as a plain directory (cppcheck's normal
        # mode: scan each .cpp, pulling in its own headers via #include, so
        # a header's usage is seen in context) - but runtime/include's own
        # .hpp files have to be passed explicitly, since a header-only
        # directory with no .cpp of its own is otherwise silently never
        # scanned at all (confirmed: `cppcheck runtime/include` alone
        # errors with "could not find or open any of the paths given").
        # Verified against cppcheck 2.13.0 specifically (Ubuntu 24.04's apt
        # version, the same one `ubuntu-latest` installs here) via a local
        # `docker run ubuntu:24.04` - this project's own dev machine runs a
        # newer Ubuntu with a newer cppcheck (2.19.0) that silently
        # tolerates some of what 2.13.0 flags, which is what made the first
        # two attempts at this fix look clean locally and still fail here.
        run: |
          cppcheck --enable=style,warning,performance,portability --inconclusive --error-exitcode=1 \
            --suppress=useStlAlgorithm --suppress=constVariableReference \
            --suppress=unusedFunction --suppress=duplicateAssignExpression \
            --suppress=shadowFunction --suppress=localMutex \
            --suppress=unsignedLessThanZero \
            --suppress=noExplicitConstructor -I compiler/src -I runtime/include --std=c++20 \
            compiler/src $(find runtime/include -name '*.hpp')

  windows-mingw:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            diffutils
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
      - name: Configure
        run: cmake --preset windows-mingw
      - name: Build
        run: cmake --build --preset windows-mingw
      - name: Test
        run: ctest --preset windows-mingw

  # No GitHub-hosted Haiku image exists, and Haiku itself can't run the
  # official Actions runner agent directly - it's a .NET application, and
  # Haiku has no .NET/Mono support at all. The workable design instead: a
  # self-hosted runner on this Linux dev machine (labeled `haiku-bridge`),
  # whose own steps run here as normal, but reach over SSH to a real Haiku
  # machine on the same LAN to do the actual configure/build/test - the
  # same thing a developer would do by hand, just scripted. This machine
  # and the Haiku box both need to be reachable for this job to pass; if
  # either is offline, this job fails/hangs rather than silently skipping.
  haiku:
    runs-on: [self-hosted, haiku-bridge]
    env:
      HAIKU_HOST: user@192.168.1.32
      HAIKU_SSH_KEY: /home/yann64/.ssh/id_ed25519_haiku
      HAIKU_REMOTE_DIR: /boot/home/ci/easybasic
    steps:
      - uses: actions/checkout@v4
      - name: Sync source to the Haiku machine
        # --delete keeps the remote source tree exactly in sync with this
        # checkout; build/ is excluded so CMake's own incremental rebuild
        # still applies between runs (full Haiku builds are slow). The
        # mkdir -p first makes this self-sufficient rather than depending
        # on the remote parent directory already existing - rsync can
        # create the leaf directory itself but not missing parents.
        run: |
          ssh -i "$HAIKU_SSH_KEY" -o StrictHostKeyChecking=accept-new "$HAIKU_HOST" "mkdir -p $HAIKU_REMOTE_DIR"
          rsync -az --delete --exclude='build/' --exclude='.git/' \
            -e "ssh -i $HAIKU_SSH_KEY -o StrictHostKeyChecking=accept-new" \
            ./ "$HAIKU_HOST:$HAIKU_REMOTE_DIR/"
      - name: Configure, build, and test on Haiku
        run: |
          ssh -i "$HAIKU_SSH_KEY" -o StrictHostKeyChecking=accept-new "$HAIKU_HOST" \
            "cd $HAIKU_REMOTE_DIR && cmake --preset haiku && cmake --build --preset haiku && ctest --preset haiku --output-on-failure"
